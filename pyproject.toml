[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mma3001-co2-fault-detection"
version = "1.0.0"
description = "Exploratory CO2 sensor fault detection with reproducible simulated faults"
requires-python = ">=3.13"
license = {file = "LICENSE"}
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: compare completed private runs against aggregate reference results"]
